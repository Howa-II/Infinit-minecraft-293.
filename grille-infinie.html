<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grille infinie</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --border: #2c313a;
    --border-light: #3a4048;
    --text: #e8e9ec;
    --text-muted: #8a8f98;
    --accent: #4a7dfc;
    --accent-hover: #3a6ce8;
    --success: #2fbf71;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    margin-right: auto;
  }
  button {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--border-light); }
  button:active { transform: scale(0.96); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-hover); }
  #status {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 90px;
    text-align: right;
  }
  #status.saved { color: var(--success); }
  #zoomlabel {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 42px;
    text-align: center;
  }
  #wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
    background:
      linear-gradient(var(--bg), var(--bg));
  }
  #wrap.dragging { cursor: grabbing; }
  #layer { position: absolute; top: 0; left: 0; }
  .cell {
    position: absolute;
    box-sizing: border-box;
    border: 1px solid var(--border);
    overflow: hidden;
    outline: none;
    color: var(--text);
    padding: 6px;
    word-break: break-word;
    background: transparent;
  }
  .cell:focus {
    border-color: var(--accent);
    background: rgba(74, 125, 252, 0.06);
  }
  footer {
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Grille infinie</h1>
    <span id="zoomlabel">100%</span>
    <button id="zout" aria-label="Dézoomer">−</button>
    <button id="zin" aria-label="Zoomer">+</button>
    <button id="reset">Réinitialiser la vue</button>
    <button id="clear">Tout effacer</button>
    <button id="save" class="primary">💾 Sauvegarder</button>
    <span id="status"></span>
  </header>
  <div id="wrap">
    <div id="layer"></div>
  </div>
  <footer>
    Glissez pour vous déplacer · molette ou pincement pour zoomer · cliquez une case pour écrire · les données sont sauvegardées dans votre navigateur (localStorage)
  </footer>
</div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const layer = document.getElementById('layer');
  const label = document.getElementById('zoomlabel');
  const statusEl = document.getElementById('status');
  const STORAGE_KEY = 'infinite-grid-data-v1';
  const CELL = 100;
  let scale = 1, offsetX = 0, offsetY = 0;
  let cells = new Map();

  // --- Chargement depuis localStorage ---
  function load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        if(data.cells) cells = new Map(data.cells);
        if(typeof data.scale === 'number') scale = data.scale;
        if(typeof data.offsetX === 'number') offsetX = data.offsetX;
        if(typeof data.offsetY === 'number') offsetY = data.offsetY;
      }
    } catch(e){ console.warn('Chargement impossible', e); }
  }

  // --- Sauvegarde manuelle ---
  function save(){
    try {
      const data = {
        cells: Array.from(cells.entries()),
        scale, offsetX, offsetY
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      statusEl.textContent = 'Enregistré ✓';
      statusEl.classList.add('saved');
      setTimeout(()=>{ statusEl.textContent = ''; statusEl.classList.remove('saved'); }, 2000);
    } catch(e){
      statusEl.textContent = 'Erreur de sauvegarde';
      statusEl.classList.remove('saved');
    }
  }

  function clampScale(s){ return Math.max(0.05, Math.min(4, s)); }

  function render(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const worldLeft = -offsetX/scale;
    const worldTop = -offsetY/scale;
    const worldRight = worldLeft + w/scale;
    const worldBottom = worldTop + h/scale;
    let c0 = Math.floor(worldLeft/CELL)-1;
    let c1 = Math.ceil(worldRight/CELL)+1;
    let r0 = Math.floor(worldTop/CELL)-1;
    let r1 = Math.ceil(worldBottom/CELL)+1;
    const maxCols = 80, maxRows = 80;
    if(c1-c0 > maxCols) c1 = c0+maxCols;
    if(r1-r0 > maxRows) r1 = r0+maxRows;

    const active = new Set();
    for(let r=r0;r<=r1;r++){
      for(let c=c0;c<=c1;c++){
        const k = c+','+r;
        active.add(k);
        let div = layer.querySelector('[data-k="'+k+'"]');
        if(!div){
          div = document.createElement('div');
          div.className = 'cell';
          div.dataset.k = k;
          div.addEventListener('mousedown', e=>e.stopPropagation());
          div.addEventListener('touchstart', e=>e.stopPropagation());
          div.addEventListener('input', ()=>{
            const t = div.textContent;
            if(t) cells.set(k, t); else cells.delete(k);
          });
          layer.appendChild(div);
        }
        div.style.left = (c*CELL*scale+offsetX)+'px';
        div.style.top = (r*CELL*scale+offsetY)+'px';
        div.style.width = (CELL*scale)+'px';
        div.style.height = (CELL*scale)+'px';
        div.style.fontSize = Math.max(11, 14*scale)+'px';
        const editable = scale > 0.28;
        div.contentEditable = editable ? 'true' : 'false';
        div.style.cursor = editable ? 'text' : 'default';
        if(document.activeElement !== div){
          div.textContent = cells.get(k) || '';
        }
      }
    }
    Array.from(layer.children).forEach(child=>{
      if(!active.has(child.dataset.k)) child.remove();
    });
    label.textContent = Math.round(scale*100)+'%';
  }

  function zoomAt(mx, my, factor){
    const newScale = clampScale(scale*factor);
    const worldX = (mx-offsetX)/scale;
    const worldY = (my-offsetY)/scale;
    offsetX = mx - worldX*newScale;
    offsetY = my - worldY*newScale;
    scale = newScale;
    render();
  }

  wrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    zoomAt(e.clientX-rect.left, e.clientY-rect.top, 1 - e.deltaY*0.001);
  }, {passive:false});

  let dragging=false, lastX=0, lastY=0;
  wrap.addEventListener('mousedown', e=>{
    dragging=true; lastX=e.clientX; lastY=e.clientY; wrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    offsetX += e.clientX-lastX; offsetY += e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    render();
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('dragging'); });

  let pinchDist = null;
  wrap.addEventListener('touchstart', e=>{
    if(e.touches.length === 2){
      const [a,b] = e.touches;
      pinchDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    } else if(e.touches.length === 1){
      dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', e=>{
    if(e.touches.length === 2){
      const [a,b] = e.touches;
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      const rect = wrap.getBoundingClientRect();
      const midX = (a.clientX+b.clientX)/2-rect.left;
      const midY = (a.clientY+b.clientY)/2-rect.top;
      if(pinchDist){ zoomAt(midX, midY, dist/pinchDist); }
      pinchDist = dist;
    } else if(e.touches.length === 1 && dragging){
      const t = e.touches[0];
      offsetX += t.clientX-lastX; offsetY += t.clientY-lastY;
      lastX = t.clientX; lastY = t.clientY;
      render();
    }
  }, {passive:true});
  wrap.addEventListener('touchend', e=>{
    if(e.touches.length < 2) pinchDist = null;
    if(e.touches.length === 0) dragging = false;
  });

  document.getElementById('zin').addEventListener('click', ()=> zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.4));
  document.getElementById('zout').addEventListener('click', ()=> zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.4));
  document.getElementById('reset').addEventListener('click', ()=>{ scale=1; offsetX=0; offsetY=0; render(); });
  document.getElementById('clear').addEventListener('click', ()=>{
    if(confirm('Effacer tout le contenu de la grille ?')){
      cells.clear();
      render();
    }
  });
  document.getElementById('save').addEventListener('click', save);

  window.addEventListener('resize', render);

  load();
  render();
})();
</script>
</body>
</html>
